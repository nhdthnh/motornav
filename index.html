<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MotoNav - Dẫn đường Xe máy & BLE</title>

  <!-- Leaflet CSS & JS (Bản đồ dự phòng miễn phí) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Giao diện Chế độ sáng (High-Contrast Light Theme) -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- KẾT NỐI BLUETOOTH MÀN HÌNH BW16 -->
  <div class="card">
    <h1>
      <span>MotoNav</span>
      <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
        <span id="bgBadge" class="pill" style="font-size:11px;">Chạy ngầm: Sẵn sàng</span>
        <span id="bleState" class="pill warn">Chưa kết nối màn hình</span>
      </div>
    </h1>
    <div class="row">
      <button id="btnConn">Kết nối MotoNav</button>
      <button id="btnConnAll" class="sec" title="Dùng khi không tìm thấy tên MotoNav">Quét tất cả BLE</button>
    </div>
    <div id="bleMsg" class="mut" style="margin-top:6px">Mẹo: Bật nguồn BW16 trước khi bấm kết nối.</div>
  </div>

  <!-- ĐIỀU HƯỚNG VÀ BẢN ĐỒ -->
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <span id="engineBadge" class="pill info">Bản đồ: Đang kiểm tra…</span>
      <button id="btnToggleKey" class="sec" style="padding:6px 10px; font-size:13px;">Cài Google Key</button>
    </div>

    <!-- Hộp cấu hình Google Maps API Key -->
    <div id="keyBox" style="display:none; background:#f1f5f9; border:1px solid var(--card-border); border-radius:10px; padding:10px; margin-bottom:10px;">
      <div style="font-size:13px; margin-bottom:6px; color:var(--mut);">
        Dán Google Maps API Key vào đây (có bật Places API, Directions API, Maps JS API):
      </div>
      <input id="keyInput" placeholder="AIzaSy..." style="font-size:14px; padding:8px;">
      <div class="row" style="margin-top:8px;">
        <button id="btnSaveKey" style="padding:8px 10px; font-size:14px;">Lưu & Dùng Google</button>
        <button id="btnClearKey" class="sec" style="padding:8px 10px; font-size:14px;">Dùng bản đồ miễn phí</button>
      </div>
    </div>

    <input id="q" placeholder="Nhập địa chỉ, tên quán, toạ độ..." enterkeyhint="search" autocomplete="off">
    <div class="row"><button id="btnSearch" class="sec">Tìm kiếm</button></div>
    <div id="results"></div>
    <div id="picked" class="mut" style="margin-top:6px"></div>

    <!-- GỢI Ý NHIỀU TUYẾN ĐƯỜNG (GOOGLE MAPS & OSRM) -->
    <div id="routeBox" style="display:none; margin-top:10px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <span style="font-size:13px; font-weight:600; color:var(--mut);">GỢI Ý TUYẾN ĐƯỜNG:</span>
        <span id="routeCount" class="pill" style="font-size:11px; padding:2px 8px;">0 tuyến</span>
      </div>
      <div id="routeList" class="route-list"></div>
    </div>

    <div class="row" style="margin-top:10px;">
      <button id="btnStart">Bắt đầu dẫn đường</button>
      <button id="btnStop" class="bad">Dừng</button>
    </div>
    <div id="msg" class="mut" style="margin-top:8px"></div>

    <!-- Bản đồ trực quan -->
    <div id="map"></div>
  </div>

  <!-- MÀN HÌNH CHỈ HƯỚNG THỜI GIAN THỰC (HUD) -->
  <div class="card">
    <div class="big">
      <div id="arrow">–</div>
      <div style="flex:1;">
        <div id="dist">--</div>
        <div id="street">Chưa dẫn đường</div>
      </div>
    </div>
    <div style="margin-top:8px; display:flex; justify-content:space-between; align-items:center;">
      <span>Gửi BLE: <code id="sent">-</code></span>
      <button id="btnLocate" class="sec" style="padding:6px 10px; font-size:12px;">Định vị tôi</button>
    </div>
  </div>

  <!-- THỬ NGHIỆM MÀN HÌNH OLED BW16 -->
  <div class="card">
    <div class="mut" style="margin-bottom:6px">Thử nghiệm gửi hình ảnh lên OLED</div>
    <div class="row">
      <button class="sec" data-t="L|250m|Nguyen Hue">Trái</button>
      <button class="sec" data-t="R|1.2km|Le Loi">Phải</button>
      <button class="sec" data-t="S|800m|Dien Bien Phu">Thẳng</button>
    </div>
    <div class="row">
      <button class="sec" data-t="U|50m|Pasteur">Quay đầu</button>
      <button class="sec" data-t="A|30m|Diem den">Đến nơi</button>
      <button class="sec" data-t="X||">Tắt</button>
    </div>
  </div>

  <!-- CÁC MODULE JAVASCRIPT ĐỘC LẬP -->
  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/background.js"></script>
  <script src="js/ble.js"></script>
  <script src="js/map-service.js"></script>
  <script src="js/search.js"></script>
  <script src="js/routing.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
